<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Primitivas Canvas 2D</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assests/css/styles.css">
</head>

<body class="app-body">

  <!-- NAVBAR -->
  <nav class="navbar navbar-dark bg-dark border-bottom border-warning-subtle">
    <div class="container">
      <span class="navbar-brand fw-semibold">
        Canvas 2D <span class="badge text-bg-warning text-dark ms-2">Primitivas</span>
      </span>
    </div>
  </nav>

  <!-- CONTENIDO -->
  <main class="container py-3 content-fit">
    <div class="row g-3 h-100">

      <!-- CARD DESCRIPCIÓN -->
      <div class="col-12 col-lg-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="fw-bold">Figuras básicas y arcos</h5>
            <ul class="small">
              <li>fillRect()</li>
              <li>clearRect()</li>
              <li>strokeRect()</li>
              <li>lineTo()</li>
              <li>arc()</li>
            </ul>
          </div>
        </div>
      </div>

      <!-- CARD CANVAS -->
      <div class="col-12 col-lg-8">
        <div class="card h-100">
          <div class="card-header d-flex justify-content-between">
            <span>Renderizado Canvas</span>
            <button id="btnRedraw" class="btn btn-dark btn-sm">Redibujar</button>
          </div>

          <div class="card-body canvas-wrap">
            <canvas id="canvas" class="canvas-box"></canvas>
          </div>

          <div class="card-footer small text-secondary">
            Rectángulos + Triángulos + Carita + Corazón moderno + Grid de Arcos
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer-fit bg-dark text-light text-center py-2">
    ANAHI DIAZ ROSALES © <span id="year"></span>
  </footer>

  <script src="./assests/js/main.js"></script>
</body>
</html>
